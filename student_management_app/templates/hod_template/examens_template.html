{% extends 'hod_template/base_template.html' %}
{% block page_title %}
Liste des examens 
{% endblock page_title %}
{% block main_content %}
    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row justify-content-center">
          {% for examen in examens %}
            <div class="col-lg-3 col-6">
                
              <!-- small box -->
              <div class="small-box bg-info">
                <div class="inner">
                  <h5>{{ examen.nom}}</h5>
  
                  <p>{{examen.annee_scolaire.nom}}</p>
                </div>
                <div class="icon">
                  <i class="ion ion-bag"></i>
                </div>
                <a href="{% url 'afficher_eleves_concernes' examen.id %}" class="small-box-footer">Voir les élèves <i class="fas fa-arrow-circle-right"></i></a>
              </div>
              
            </div>
            {% endfor %}

      </div>
    </section>
    <!-- /.content -->

{% endblock main_content %}
